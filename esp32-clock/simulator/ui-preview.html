<style>
.clock-redesign{font-family:var(--font-sans,Arial,sans-serif);color:var(--color-text-primary,#282824)}.clock-redesign .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.clock-redesign .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px}.clock-redesign button{font:400 12px var(--font-sans,Arial,sans-serif);padding:7px 13px;border:0.5px solid #d3d1c7;border-radius:8px;background:#fff;color:#444441;cursor:pointer}.clock-redesign button[aria-pressed=true]{background:#faece7;border-color:#d85a30;color:#993c1d}.clock-redesign .views{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:36px}.clock-redesign figure{margin:0;text-align:center}.clock-redesign figcaption{font-size:12px;font-weight:400;color:#5f5e5a;margin-bottom:14px}.clock-redesign .case{padding:20px;border:0.5px solid #d3d1c7;border-radius:34px;background:#fff}.clock-redesign .bezel{padding:9px;background:#efeee9;border:0.5px solid #d3d1c7;border-radius:14px}.clock-redesign .screen-large{display:block;width:312px;height:312px}.clock-redesign .actual{display:block;width:240px;height:240px;border:0.5px solid #d3d1c7}.clock-redesign .cable{margin:0 auto;width:31px;height:24px;background:#f1efe8;border:0.5px solid #d3d1c7;border-top:0;border-radius:0 0 6px 6px}.clock-redesign .scale-mark{font-size:11px;color:#888780;margin-top:14px}.clock-redesign label{display:flex;align-items:center;gap:5px;font-size:12px;color:#5f5e5a;margin-left:4px}@media(max-width:400px){.clock-redesign .screen-large{width:264px;height:264px}.clock-redesign .case{padding:14px}}
</style>
<section class="clock-redesign"><h2 class="sr-only">ESP32 方形时钟的暖白日常模式和极简模式，可切换供电状态并演示秒数变化。</h2><div class="toolbar"><button id="clk-daily" type="button" aria-pressed="true">日常模式</button><button id="clk-minimal" type="button" aria-pressed="false">极简模式</button><button id="clk-power" type="button" aria-pressed="false">切换电池供电</button><label><input id="clk-tick" type="checkbox">演示走时</label></div><div class="views"><figure><figcaption>外壳搭配 · 放大预览</figcaption><div class="case"><div class="bezel"><svg id="clk-large" class="screen-large" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="暖白色时钟界面"><rect width="240" height="240" fill="#f7f5ef"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400"><text x="16" y="28" fill="#444441" font-size="13">11月03日<tspan x="104" font-size="12">周二</tspan></text><path d="M194 20l-4 6h5l-2 6 8-9h-5l2-3" fill="#993c1d"/><path d="M207 21h15v10h-15zM224 24v4" fill="none" stroke="#5f5e5a" stroke-width="1.2"/><rect x="210" y="24" width="9" height="4" fill="#5f5e5a"/><path d="M16 45h208" fill="none" stroke="#dedbd3"/><text x="120" y="119" text-anchor="middle" fill="#2c2c2a" font-size="76" font-weight="500" textLength="210" lengthAdjust="spacingAndGlyphs" style="font-variant-numeric:tabular-nums">11:35</text><text x="16" y="142" fill="#5f5e5a" font-size="11">北京时间</text><circle cx="181" cy="138" r="2" fill="#d85a30"/><text x="224" y="142" text-anchor="end" fill="#993c1d" font-size="12">27 秒</text><path d="M16 158h208" fill="none" stroke="#dedbd3"/><circle cx="30" cy="183" r="7" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/><path d="M30 169v3m0 22v3m-14-14h3m22 0h3m-24-10 2 2m16 16 2 2m-20 0 2-2m16-16 2-2" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round"/><text x="54" y="184" fill="#2c2c2a" font-size="22" font-weight="500">22°<tspan x="101" y="182" font-size="13" font-weight="400">晴</tspan></text><text x="54" y="201" fill="#5f5e5a" font-size="11">北京 · 空气优</text><path d="M217 179l4 4-4 4" fill="none" stroke="#888780" stroke-width="1.2"/><path d="M16 213h208" fill="none" stroke="#dedbd3"/><text x="16" y="232" fill="#5f5e5a" font-size="11">九月廿四</text><text x="224" y="232" text-anchor="end" fill="#5f5e5a" font-size="11">今日无日程</text></g></svg></div></div><div class="cable"></div></figure><figure><figcaption>实际像素 · 240 × 240</figcaption><svg id="clk-actual" class="actual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="原始240像素界面"></svg><div class="scale-mark">1 : 1 逻辑像素</div></figure></div></section>
<script>
(function(){let mode='daily',battery=false,total=11*3600+35*60+27;const large=document.getElementById('clk-large'),actual=document.getElementById('clk-actual'),daily=document.getElementById('clk-daily'),minimal=document.getElementById('clk-minimal'),power=document.getElementById('clk-power'),tick=document.getElementById('clk-tick');const line='<path d="M16 45h208" fill="none" stroke="#dedbd3"/>';function render(){const h=String(Math.floor(total/3600)%24).padStart(2,'0'),m=String(Math.floor(total/60)%60).padStart(2,'0'),s=String(total%60).padStart(2,'0');const status=battery?'<text x="203" y="28" text-anchor="end" fill="#5f5e5a" font-size="11">82%</text><path d="M207 21h15v10h-15zM224 24v4" fill="none" stroke="#5f5e5a" stroke-width="1.2"/><rect x="210" y="24" width="8" height="4" fill="#5f5e5a"/>':'<path d="M194 20l-4 6h5l-2 6 8-9h-5l2-3" fill="#993c1d"/><path d="M207 21h15v10h-15zM224 24v4" fill="none" stroke="#5f5e5a" stroke-width="1.2"/><rect x="210" y="24" width="9" height="4" fill="#5f5e5a"/>';let content;if(mode==='daily'){content='<text x="16" y="28" fill="#444441" font-size="13">11月03日<tspan x="104" font-size="12">周二</tspan></text>'+status+line+'<text x="120" y="119" text-anchor="middle" fill="#2c2c2a" font-size="76" font-weight="500" textLength="210" lengthAdjust="spacingAndGlyphs" style="font-variant-numeric:tabular-nums">'+h+':'+m+'</text><text x="16" y="142" fill="#5f5e5a" font-size="11">北京时间</text><circle cx="181" cy="138" r="2" fill="#d85a30"/><text x="224" y="142" text-anchor="end" fill="#993c1d" font-size="12">'+s+' 秒</text><path d="M16 158h208" fill="none" stroke="#dedbd3"/><circle cx="30" cy="183" r="7" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/><path d="M30 169v3m0 22v3m-14-14h3m22 0h3m-24-10 2 2m16 16 2 2m-20 0 2-2m16-16 2-2" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round"/><text x="54" y="184" fill="#2c2c2a" font-size="22" font-weight="500">22°<tspan x="101" y="182" font-size="13" font-weight="400">晴</tspan></text><text x="54" y="201" fill="#5f5e5a" font-size="11">北京 · 空气优</text><path d="M217 179l4 4-4 4" fill="none" stroke="#888780" stroke-width="1.2"/><path d="M16 213h208" fill="none" stroke="#dedbd3"/><text x="16" y="232" fill="#5f5e5a" font-size="11">九月廿四</text><text x="224" y="232" text-anchor="end" fill="#5f5e5a" font-size="11">今日无日程</text>';}else{content='<text x="16" y="28" fill="#444441" font-size="12">11月03日 · 周二</text>'+status+'<text x="120" y="125" text-anchor="middle" fill="#2c2c2a" font-size="83" font-weight="500" textLength="210" lengthAdjust="spacingAndGlyphs" style="font-variant-numeric:tabular-nums">'+h+':'+m+'</text><rect x="24" y="150" width="192" height="2" rx="1" fill="#dedbd3"/><rect x="24" y="150" width="'+Math.round((total%60)/60*192)+'" height="2" rx="1" fill="#d85a30"/><text x="120" y="177" text-anchor="middle" fill="#993c1d" font-size="12">'+s+' 秒</text><text x="120" y="219" text-anchor="middle" fill="#5f5e5a" font-size="12">农历九月廿四</text>';}const svg='<title>240×240 '+(mode==='daily'?'日常':'极简')+'时钟</title><desc>暖白底深灰时间，橙色秒数；天气、农历与供电均为演示数据。</desc><rect width="240" height="240" fill="#f7f5ef"/><g font-family="Arial,\'PingFang SC\',\'Microsoft YaHei\',sans-serif" font-weight="400">'+content+'</g>';large.innerHTML=svg;actual.innerHTML=svg;daily.setAttribute('aria-pressed',mode==='daily');minimal.setAttribute('aria-pressed',mode==='minimal');power.setAttribute('aria-pressed',battery);power.textContent=battery?'切换 USB 供电':'切换电池供电';}daily.onclick=function(){mode='daily';render();};minimal.onclick=function(){mode='minimal';render();};power.onclick=function(){battery=!battery;render();};render();setInterval(function(){if(tick.checked){total=(total+1)%86400;render();}},1000);})();
</script>
